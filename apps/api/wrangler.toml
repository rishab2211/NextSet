name = "nextset-api"
main = "src/index.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]

# Local development default
[[d1_databases]]
binding = "DB"
database_name = "nextset-db"
database_id = "36fa836b-e0f3-4d4e-a63d-c54701071ce5"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"

# Production environment target
# Deploy via: `npm run deploy:api:prod` or `wrangler deploy --env production`
[env.production]
name = "nextset-api-production"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "nextset-db"
database_id = "36fa836b-e0f3-4d4e-a63d-c54701071ce5"
migrations_dir = "migrations"
