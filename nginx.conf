server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Service Worker: Do not cache
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Web App Manifest
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Content-Type "application/manifest+json";
    }

    # Hashed static Next.js assets: Cache indefinitely (1 year)
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images & icons
    location ~* \.(ico|png|svg|jpg|jpeg|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # SPA routing fallback for Next.js trailingSlash export
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
    }
}
